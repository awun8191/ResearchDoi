[project]
name = "api"
version = "0.1.0"
description = "ResearchDoi backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[all]>=0.134.0",
    "firebase-admin>=7.2.0",
    "requests>=2.32.5",
    "httpx>=0.28.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.27.2",
    "pymupdf4llm>=1.27.2.1",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.2",
    "google-cloud-aiplatform>=1.141.0",
]



[tool.pyright]
executionEnvironments = [
  { root = "." }
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
